name: CI

on:
  push:
    branches: [main, develop]
  pull_request:         # all branches — catches failures before merge
  workflow_dispatch:    # manual trigger for any branch

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python linters
        run: pip install ruff

      - name: Lint Python
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Cache LLVM 21 apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-llvm-21-${{ runner.os }}-v1

      - name: Install LLVM/MLIR 21
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y mlir-21-tools libmlir-21-dev llvm-21-dev libgtest-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DMLIR_DIR=/usr/lib/llvm-21/lib/cmake/mlir

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  container-test:
    name: Container Build & Test
    runs-on: ubuntu-latest
    needs: lint
    # Only run on push to main/develop — build-and-test already proves
    # correctness on PRs. Container build (~20 min) is too expensive to
    # run on every feature-branch push.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image (with GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: kernelsmith:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in container
        run: docker run --rm kernelsmith:test

  publish:
    name: Publish Container
    runs-on: ubuntu-latest
    needs: [build-and-test, container-test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
