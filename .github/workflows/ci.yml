name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python linters
        run: pip install ruff cmake-format

      - name: Lint Python
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/MLIR
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y mlir-18-tools libmlir-18-dev

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DMLIR_DIR=/usr/lib/llvm-18/lib/cmake/mlir

      - name: Build
        run: cmake --build build --parallel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/bin/

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest numpy

      - name: Run unit tests
        run: python -m pytest tests/unit -v --tb=short
        continue-on-error: true  # Allow to pass if no tests yet

  test-lit:
    name: Lit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/bin/

      - name: Make binaries executable
        run: chmod +x build/bin/*

      - name: Install lit
        run: pip install lit filecheck

      - name: Run lit tests
        run: lit tests/lit -v
        continue-on-error: true  # Allow to pass if no tests yet

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest numpy

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/bin/

      - name: Run integration tests
        run: python -m pytest tests/integration -v --tb=short
        continue-on-error: true  # Allow to pass if no tests yet

  test-riscv:
    name: RISC-V MatMul Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu \
            qemu-user

      - name: Install Python dependencies
        run: pip install pytest numpy

      - name: Run RISC-V matmul integration tests
        run: |
          python -m pytest tests/integration/test_matmul_riscv_pipeline.py \
            -v --tb=short -x

      - name: Run RISC-V matmul unit tests
        run: |
          python -m pytest tests/unit/test_matmul_f32.py \
            -v --tb=short
