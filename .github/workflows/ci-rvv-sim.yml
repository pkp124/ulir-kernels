# =============================================================================
# CI: RISC-V RVV Simulation Tests
# =============================================================================
# Tests the M4 RVV verification path end-to-end:
#   1. build-rvv-kernels — builds host and riscv64 descriptor runners
#   2. simulate-qemu    — runs golden-backed verification at VLEN=256/512
#   3. simulate-spike   — runs on Spike ISA simulator (optional, better RVV 1.0)
#
# Adapted from: https://github.com/pkp124/riscv (ci-build.yml patterns)
#
# Key differences from pkp124/riscv:
#   - Uses qemu-user (user-mode) instead of qemu-system (bare-metal).
#   - Uses descriptor-defined golden inputs and NumPy comparison policy.
#   - Tests f32, INT8, and W4A8 smoke cases under RVV QEMU.
# =============================================================================

name: CI - RVV Simulation

on:
  push:
    branches: [main, develop, 'claude/**', 'cursor/**']
    paths:
      - 'lib/Passes/**'
      - 'lib/kernelsmith/**'
      - 'include/KernelSmith/Passes/**'
      - 'include/kernelsmith/**'
      - 'target/riscv_rvv_256.h'
      - 'tests/riscv/**'
      - 'tests/golden/**'
      - 'tests/host_reference/**'
      - 'tests/riscv_runner.py'
      - 'tests/verify.py'
      - 'scripts/compile-rvv.sh'
      - 'scripts/generate-int8-rvv-objects.py'
      - 'scripts/run-tests.sh'
      - 'scripts/setup-rvv-sim.sh'
      - '.github/workflows/ci-rvv-sim.yml'
  pull_request:
    paths:
      - 'lib/Passes/**'
      - 'lib/kernelsmith/**'
      - 'include/KernelSmith/Passes/**'
      - 'include/kernelsmith/**'
      - 'target/riscv_rvv_256.h'
      - 'tests/riscv/**'
      - 'tests/golden/**'
      - 'tests/host_reference/**'
      - 'tests/riscv_runner.py'
      - 'tests/verify.py'
      - 'scripts/compile-rvv.sh'
      - 'scripts/generate-int8-rvv-objects.py'
      - 'scripts/run-tests.sh'
      - 'scripts/setup-rvv-sim.sh'
      - '.github/workflows/ci-rvv-sim.yml'
  workflow_dispatch:
    inputs:
      run_spike:
        description: 'Run Spike simulations (slow — builds from source)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Job 1: Build ks-opt and descriptor runner binaries
# =============================================================================
jobs:
  build-rvv-kernels:
    name: "Build RVV kernels"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Cache LLVM 21 apt packages (matches existing ci.yml)
      # -----------------------------------------------------------------------
      - name: Cache LLVM 21 apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-llvm-21-rvv-${{ runner.os }}-v1

      - name: Install LLVM/MLIR 21
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y \
            mlir-21-tools \
            libmlir-21-dev \
            llvm-21-dev \
            libgtest-dev \
            clang-21

          # Ensure unversioned symlinks exist for ks-opt build + llc usage.
          for tool in mlir-translate llc clang; do
            if ! command -v "${tool}" &>/dev/null && command -v "${tool}-21" &>/dev/null; then
              sudo update-alternatives --install /usr/bin/${tool} ${tool} \
                /usr/bin/${tool}-21 21
            fi
          done

          echo "mlir-translate: $(mlir-translate --version 2>&1 | head -1)"
          echo "llc: $(llc --version 2>&1 | head -1)"
          llc --version 2>&1 | grep -i "riscv" || echo "WARNING: LLVM RISC-V target not listed"

      # -----------------------------------------------------------------------
      # Install RISC-V cross-compiler (for linking ELF binaries)
      # -----------------------------------------------------------------------
      - name: Install RISC-V cross-compiler
        run: |
          sudo apt-get install -y \
            gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross
          riscv64-linux-gnu-gcc --version | head -1

      # -----------------------------------------------------------------------
      # Build ks-opt (same as ci.yml build-and-test)
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Configure KernelSmith
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DMLIR_DIR=/usr/lib/llvm-21/lib/cmake/mlir

      - name: Build ks-opt and host runner
        run: cmake --build build --parallel --target ks-opt host-reference-runner

      # -----------------------------------------------------------------------
      # Build descriptor-backed runners used by tests/verify.py
      # -----------------------------------------------------------------------
      - name: Build descriptor runner artifacts
        run: |
          mkdir -p build-rvv/bin

          echo "=== Host descriptor runner ==="
          cp build/tests/host_reference/host-reference-runner \
            build-rvv/bin/host-reference-runner

          echo "=== RISC-V descriptor runner ==="
          python scripts/generate-int8-rvv-objects.py \
            --cc riscv64-linux-gnu-gcc \
            --source-root . \
            --output-dir build-rvv/int8-objects

          riscv64-linux-gnu-gcc \
            -std=c99 \
            -O2 \
            -static \
            -march=rv64gcv \
            -mabi=lp64d \
            -DKS_QUANTIZED_INT8_EXTERNAL=1 \
            -I include \
            -include target/riscv_rvv_256.h \
            tests/host_reference/host_reference_runner.c \
            lib/kernelsmith/ks_common.c \
            lib/kernelsmith/ks_matmul.c \
            lib/kernelsmith/ks_activations.c \
            lib/kernelsmith/ks_quantized.c \
            build-rvv/int8-objects/ks_dot_i8_riscv_rvv_256.o \
            build-rvv/int8-objects/ks_matvec_i8_riscv_rvv_256.o \
            -o build-rvv/bin/riscv-golden-runner \
            -lm
          file build-rvv/bin/riscv-golden-runner
          echo "descriptor runner artifacts built successfully"

      - name: Upload RVV runner artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rvv-golden-runners
          path: build-rvv/bin/
          retention-days: 7

# =============================================================================
# Job 2: QEMU simulation — multi-VLEN matrix
# =============================================================================
  simulate-qemu:
    name: "QEMU ${{ matrix.name }}"
    runs-on: ubuntu-24.04
    needs: build-rvv-kernels

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "RVV VLEN=256"
            vlen: 256
            cpu_args: "rv64,v=true,vlen=256,vext_spec=v1.0"
          - name: "RVV VLEN=512"
            vlen: 512
            cpu_args: "rv64,v=true,vlen=512,vext_spec=v1.0"

    steps:
      - name: Install qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user qemu-user-static
          qemu-riscv64 --version | head -1

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Download RVV runner artifacts
        uses: actions/download-artifact@v4
        with:
          name: rvv-golden-runners
          path: rvv-bin/

      - name: Prepare binaries
        run: chmod +x rvv-bin/*

      - name: "Verify golden cases (VLEN=${{ matrix.vlen }})"
        timeout-minutes: 5
        run: |
          mkdir -p build/golden-rvv

          python tests/verify.py \
            --case tests/golden/cases/relu_f32_smoke.json \
            --target riscv_rvv_256 \
            --riscv-runner rvv-bin/riscv-golden-runner \
            --host-runner rvv-bin/host-reference-runner \
            --qemu qemu-riscv64 \
            --vlens ${{ matrix.vlen }} \
            --output-dir build/golden-rvv \
            --report build/golden-rvv/relu_vlen_${{ matrix.vlen }}.json

          python tests/verify.py \
            --case tests/golden/cases/matmul_f32_smoke.json \
            --target riscv_rvv_256 \
            --riscv-runner rvv-bin/riscv-golden-runner \
            --host-runner rvv-bin/host-reference-runner \
            --qemu qemu-riscv64 \
            --vlens ${{ matrix.vlen }} \
            --output-dir build/golden-rvv \
            --report build/golden-rvv/matmul_vlen_${{ matrix.vlen }}.json \
            --benchmark \
            --benchmark-runs 3 \
            --benchmark-warmup 1

          python tests/verify.py \
            --case tests/golden/cases/dot_i8_smoke.json \
            --target riscv_rvv_256 \
            --riscv-runner rvv-bin/riscv-golden-runner \
            --host-runner rvv-bin/host-reference-runner \
            --qemu qemu-riscv64 \
            --vlens ${{ matrix.vlen }} \
            --output-dir build/golden-rvv \
            --report build/golden-rvv/dot_i8_vlen_${{ matrix.vlen }}.json

          python tests/verify.py \
            --case tests/golden/cases/matvec_i8_smoke.json \
            --target riscv_rvv_256 \
            --riscv-runner rvv-bin/riscv-golden-runner \
            --host-runner rvv-bin/host-reference-runner \
            --qemu qemu-riscv64 \
            --vlens ${{ matrix.vlen }} \
            --output-dir build/golden-rvv \
            --report build/golden-rvv/matvec_i8_vlen_${{ matrix.vlen }}.json

          python tests/verify.py \
            --case tests/golden/cases/dot_w4a8_smoke.json \
            --target riscv_rvv_256 \
            --riscv-runner rvv-bin/riscv-golden-runner \
            --host-runner rvv-bin/host-reference-runner \
            --qemu qemu-riscv64 \
            --vlens ${{ matrix.vlen }} \
            --output-dir build/golden-rvv \
            --report build/golden-rvv/dot_w4a8_vlen_${{ matrix.vlen }}.json

          python tests/verify.py \
            --case tests/golden/cases/matvec_w4a8_smoke.json \
            --target riscv_rvv_256 \
            --riscv-runner rvv-bin/riscv-golden-runner \
            --host-runner rvv-bin/host-reference-runner \
            --qemu qemu-riscv64 \
            --vlens ${{ matrix.vlen }} \
            --output-dir build/golden-rvv \
            --report build/golden-rvv/matvec_w4a8_vlen_${{ matrix.vlen }}.json \
            --benchmark \
            --benchmark-runs 3 \
            --benchmark-warmup 1

      - name: Upload RVV verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rvv-golden-reports-${{ matrix.vlen }}
          path: build/golden-rvv/
          retention-days: 7

# =============================================================================
# Job 3: Spike simulation (optional — only on workflow_dispatch with flag)
# =============================================================================
  simulate-spike:
    name: "Spike RVV"
    runs-on: ubuntu-24.04
    needs: build-rvv-kernels
    # Only run when manually triggered with run_spike=true.
    # Spike build from source takes ~10 min; not suitable for every push.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_spike == true }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Spike build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            device-tree-compiler \
            libboost-regex-dev \
            libboost-system-dev \
            build-essential git

      - name: Build Spike from source
        run: |
          git clone --depth 1 \
            https://github.com/riscv-software-src/riscv-isa-sim.git /tmp/spike-src
          cd /tmp/spike-src
          mkdir build && cd build
          ../configure --prefix=/opt/riscv
          make -j$(nproc)
          sudo make install
          /opt/riscv/bin/spike --help 2>&1 | head -3 || true

      - name: Install pk (proxy kernel) for Spike user-mode
        run: |
          # riscv-pk provides the pk proxy kernel needed for Spike user-mode ELF execution.
          sudo apt-get install -y gcc-riscv64-linux-gnu
          git clone --depth 1 \
            https://github.com/riscv-software-src/riscv-pk.git /tmp/pk-src
          mkdir -p /tmp/pk-src/build && cd /tmp/pk-src/build
          ../configure --prefix=/opt/riscv --host=riscv64-linux-gnu
          make -j$(nproc)
          sudo make install

      - name: Download RVV runner artifacts
        uses: actions/download-artifact@v4
        with:
          name: rvv-golden-runners
          path: rvv-bin/

      - name: Prepare binaries
        run: chmod +x rvv-bin/*

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -e "."

      - name: "Simulate descriptor ReLU on Spike (RVV 1.0)"
        timeout-minutes: 5
        run: |
          export PATH="/opt/riscv/bin:$PATH"
          mkdir -p spike-data
          python - <<'PY'
          import numpy as np
          x = np.load("tests/golden/generated/relu_f32_smoke/input_X.npy")
          x.astype("float32").tofile("spike-data/input_X.f32")
          PY

          echo "Running descriptor ReLU on Spike with +v extension"
          # Spike flags: --isa=rv64gcv enables V extension, --varch sets VLEN/ELEN.
          spike \
            --isa=rv64gcv \
            --varch="vlen:256,elen:64" \
            /opt/riscv/riscv64-unknown-linux-gnu/bin/pk \
            rvv-bin/riscv-golden-runner \
            relu spike-data/input_X.f32 spike-data/actual_Y.f32 16

          python - <<'PY'
          import numpy as np
          actual = np.fromfile("spike-data/actual_Y.f32", dtype=np.float32)
          expected = np.load("tests/golden/generated/relu_f32_smoke/expected_Y.npy")
          np.testing.assert_allclose(actual.reshape(expected.shape), expected, rtol=1e-6, atol=1e-6)
          print("PASS: descriptor ReLU on Spike")
          PY
