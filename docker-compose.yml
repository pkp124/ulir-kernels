# ==============================================================================
# KernelSmith — docker compose services
#
# Services:
#   test   Build and run all tests (default)
#   dev    Interactive shell with full toolchain
#   lint   Run Python + C++ linters
# ==============================================================================

services:
  test:
    build:
      context: .
      target: test
    volumes:
      - build-cache:/workspace/build

  dev:
    build:
      context: .
      target: dev
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - build-cache:/workspace/build

  lint:
    build:
      context: .
      target: lint

volumes:
  build-cache:
