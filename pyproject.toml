[project]
name = "kernelsmith"
version = "0.1.0"
description = "Craft optimized AI kernels for any architecture"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0"

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "lit>=18.0",
    "filecheck>=0.0.24",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# lit.cfg.py uses a `config` global injected by the lit test runner at runtime
"tests/lit/lit.cfg.py" = ["F821"]
"tests/lit/lit.site.cfg.py.in" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["kernelsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
